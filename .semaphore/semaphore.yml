version: v1.0
name: "\U0001F680 Go Project CI/CD Pipeline"
agent:
  machine:
    type: a2-standard-4
    os_image: macos-xcode16
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch != 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - sem-version go 1.22
      - cache restore
blocks:
  - name: Install Dependencies
    task:
      jobs:
        - name: Install
          commands:
            - export GO111MODULE=on
            - export GOPATH=~/go
            - 'export PATH=/home/semaphore/go/bin:$PATH'
            - checkout
            - cache restore
            - go mod vendor
            - cache store
  - name: Test
    task:
      prologue:
        commands:
          - sem-version go 1.18
          - export GO111MODULE=on
          - export GOPATH=~/go
          - 'export PATH=/home/semaphore/go/bin:$PATH'
          - checkout
          - cache restore
          - go mod vendor
      jobs:
        - name: Test
          commands:
            - go test ./...
  - name: Build
    task:
      prologue:
        commands:
          - sem-version go 1.18
          - export GO111MODULE=on
          - export GOPATH=~/go
          - 'export PATH=/home/semaphore/go/bin:$PATH'
          - checkout
          - cache restore
          - go mod vendor
      jobs:
        - name: Build
          commands:
            - go build -v -o go-gin-app
            - artifact push project --force go-gin-app
